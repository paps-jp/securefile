# Reverse proxy for セキュファイル便.
#
# The two settings that matter most here are the disabled request body limit
# and the long timeouts: this proxies multi-gigabyte uploads, and nginx's
# defaults (1 MiB bodies, 60 s reads) would reject or cut them.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name up.paps.jp;

    ssl_certificate     /etc/letsencrypt/live/up.paps.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/up.paps.jp/privkey.pem;

    # Upload parts are 8 MiB, but a body limit here would also cap any future
    # part size; the application enforces the real limits.
    client_max_body_size 0;

    # Stream request bodies straight through instead of spooling each part to
    # disk first, which would double the write load and add latency.
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 15s;

    location / {
        proxy_pass http://10.10.50.74:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name up.paps.jp;
    return 301 https://$host$request_uri;
}
